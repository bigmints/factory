  - name: "US-010 + US-011: engine/build-tools.ts — tool schema and executor"
    prompt: |
      Working in /Users/pretheesh/Projects/factory.
      Read .factory/context/context.toon. Start task us_010_build_tool_schema and us_011_tool_executor.

      Create engine/build-tools.ts with:

      1. Interface BuildToolContext:
         workDir: string
         spec: AppSpec | FeatureSpec
         context: ProjectContext
         toonSnapshot: string
         terminal?: boolean
         result?: { success: boolean; summary: string; reason?: string }

      2. Interface ToolResult:
         content: string  (JSON string of result)
         isError?: boolean

      3. TOOL_DEFINITIONS array — OpenAI function-call format:
         - read_file: { path: string } → returns file content as string
         - write_file: { path: string, content: string } → returns "written"
         - list_dir: { path: string } → returns JSON array of filenames
         - run_command: { cmd: string, cwd?: string } → returns { stdout, stderr, exitCode }
         - read_spec: {} → returns JSON.stringify(ctx.spec)
         - read_context: {} → returns ctx.toonSnapshot
         - log_step: { message: string } → returns "logged"
         - mark_complete: { success: boolean, summary: string } → sets ctx.terminal=true
         - mark_failed: { reason: string, error: string } → sets ctx.terminal=true, success=false

      4. async function executeTool(name: string, args: Record<string, unknown>, ctx: BuildToolContext): Promise<ToolResult>
         - read_file: fs.readFileSync(resolve(ctx.workDir, args.path), 'utf-8')
         - write_file: mkdirSync(dirname(...), {recursive:true}), writeFileSync(...)
         - list_dir: readdirSync(...).join(', ')
         - run_command: execSync(args.cmd, { cwd: args.cwd || ctx.workDir, timeout: 120_000 }) → capture stdout/stderr
         - All errors → return { content: JSON.stringify({ error: msg }), isError: true } — never throw
         - mark_complete / mark_failed: set ctx.terminal = true, ctx.result = {...}

      5. Export TOOL_DEFINITIONS and executeTool

      Run: npx tsc --noEmit — fix all type errors.
      Commit: "feat(engine): build-tools.ts — tool schema and executor"
    workdir: /Users/pretheesh/Projects/factory
    approval_mode: yolo

