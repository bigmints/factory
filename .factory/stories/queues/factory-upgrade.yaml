         - RULES section (read before write, run install+typecheck+lint after writing, fix all errors, call mark_complete when clean)
         - REASON CODES for mark_failed: typecheck | lint | tests | scope_too_large | ambiguous_spec | infra_error
         - Fenced toon block: ```toon\n{context.toonSnapshot || 'no context available'}\n```
         - Spec block: ```yaml\n{yamlStringify(spec)}\n```
         - Skills block if context.projectSkills: ## Project Skills\n{context.projectSkills}

      2. async function runToolSession(spec, context, systemPrompt): Promise<BuildResult>
         - Import TOOL_DEFINITIONS and executeTool from ./build-tools.ts
         - Build BuildToolContext: { workDir: tmpdir or targetDir, spec, context, toonSnapshot: context.toonSnapshot || '' }
         - messages array starting with { role: 'system', content: systemPrompt }
         - Loop (max 30 turns):
           a. Call LLM (callProvider) with messages + tools=TOOL_DEFINITIONS
           b. If response has tool_calls: execute each via executeTool(), append tool results to messages
           c. If ctx.terminal: break
           d. Token guard: if messages.length > 20, trim to system + last 15 messages
         - Return BuildResult from ctx.result, with files scanned from workDir

