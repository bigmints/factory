  "2026-05-30 13:43:16","committed: fix(ui): mark stories in done/ folder as completed in getEffectiveStatus",".factory/blueprint/worklog.yaml,.factory/context/heartbeat.yaml,ui/src/components/notion-board.tsx"
  "2026-05-30 13:54:43","committed: fix(queue): archive story to done/ and update YAML status on successful build\n\nRoot cause: runBuild() never updated story YAML status or moved files to\ndone/ after a successful build. When the queue was cleared, queueStatus\nbecame undefined and getEffectiveStatus() fell back to the YAML status\n('ready'), causing completed stories to bounce back to Ready to Build.\n\nFix:\n- engine/queue.ts runBuild(): on success, (1) write status:done to story\n  YAML, (2) archive (move) the file from features/|apps/ to done/, and\n  (3) update scaffold.yaml rollup via updateStoryStatusInApp()\n- ui/api/queue/clear/route.ts: same three-step patch for any completed\n  items before wiping the queue, so manually clearing doesn't lose state\n\nAlso: manually ran the fix script to clear the existing 3 completed items\nfrom local queue.yaml and verify they're properly archived in done/",".factory/blueprint/worklog.yaml,.factory/context/heartbeat.yaml,engine/queue.ts,ui/src/app/api/queue/clear/route.ts"
  "2026-05-30 14:06:33","committed: fix(orchestrate): add ~/.local/bin to CLI spawn PATH so gemini is found\n\ngemini CLI is installed at ~/.local/bin/gemini but that directory was\nmissing from the PATH injected when spawning CLI child processes, causing\nENOENT. Added ~/.local/bin (and /usr/local/bin) ahead of nvm bin paths\nso all common install locations are covered.",".factory/blueprint/worklog.yaml,.factory/context/heartbeat.yaml,engine/orchestrate.ts"
  "2026-05-30 14:12:23","committed: fix(rollup): roadmap now shows all physical stories, not just scaffold.yaml entries\n\ngetAppRollup now scans features/, apps/, done/ for story files not yet\ntracked in scaffold.yaml and injects them as in-memory synthetic epics\nbefore rollup computation. Read-only — no disk writes, no queue impact.\n\nThis makes the Roadmap view match the Sprint board: all stories appear\nregardless of whether they were added via scaffold.yaml or directly as\nphysical YAML files.",".factory/blueprint/worklog.yaml,.factory/context/heartbeat.yaml,engine/rollup.ts"
  "2026-05-30 14:17:29","committed: feat(ui): replace roadmap/sprint tabs with single flat task list\n\nRemove the hierarchical backlog tree and kanban sprint board. Replace both\nwith FlatTaskList — a single, clean, scrollable list of all tasks sorted\nby status priority (running → ready → draft → done), with:\n- Status dot + badge\n- Epic tag (colour-coded)\n- Phase indicator\n- Scaffold tag\n- Hover: Build button (ready stories) or Running pill + open button\n- Done tasks are struck-through at 60% opacity\n\nNo tabs, no hierarchy, no columns. One list.",".factory/blueprint/worklog.yaml,.factory/context/heartbeat.yaml,ui/src/components/notion-board.tsx"
  "2026-05-30 14:24:23","committed: fix(cli): factory feature build now exits 1 on failure — no more phantom COMPLETED\n\nRoot cause: handleFeature 'build' called updateStoryStatus('done') + archiveStory()\nUNCONDITIONALLY after runFeaturePipeline(), regardless of result.success.\nThis meant failed orchestrations (e.g. gemini ENOENT) were archived to done/\nand the CLI exited 0, so queue/start/route.ts saw exit code 0 and set the\nqueue item status to 'completed'.\n\nFix: Guard all post-build state mutations behind result.success:\n  success → archive + mark done + git commit + exit(0)\n  failure → mark review (no archive) + log errors + exit(1)\n\nThe queue/start API uses exit code to decide completed vs failed, so this\nis the correct contract. Failed builds now correctly show as FAILED in the\npipeline and the story stays in features/ (not archived to done/).",".factory/blueprint/worklog.yaml,.factory/context/heartbeat.yaml,engine/cli.ts"
