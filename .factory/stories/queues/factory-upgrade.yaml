      Create factory/scripts/heartbeat/setup-hooks.sh:
      #!/usr/bin/env bash
      set -euo pipefail
      PROJECT_ROOT="${FACTORY_PROJECT_ROOT:-$(git rev-parse --show-toplevel)}"
      HOOKS_DIR="$PROJECT_ROOT/.git/hooks"

      Write pre-commit hook to $HOOKS_DIR/pre-commit:
        #!/usr/bin/env bash
        TASKS_FILE="$PROJECT_ROOT/.factory/task-manager/todo.toon"
        if [ -f "$TASKS_FILE" ]; then
          if ! grep -q "in_progress" "$TASKS_FILE"; then
            echo "ERROR: No in_progress task. Run: factory task start <id>" >&2
            exit 1
          fi
          HEARTBEAT="$PROJECT_ROOT/.factory/context/heartbeat.toon"
          if [ -f "$HEARTBEAT" ]; then
            # warn if >30 min old (using find -mmin)
            if find "$HEARTBEAT" -mmin +30 -print | grep -q .; then
              echo "WARNING: Heartbeat is >30 min stale. Run: factory pulse 'resuming'" >&2
            fi
          fi
        fi

      Write post-commit hook to $HOOKS_DIR/post-commit:
        #!/usr/bin/env bash
        MSG=$(git log -1 --format='%s')
        factory pulse "Committed: $MSG" 2>/dev/null || true
        factory context update "$MSG" 2>/dev/null || true

      chmod +x $HOOKS_DIR/pre-commit $HOOKS_DIR/post-commit setup-hooks.sh

