  "2026-05-23 09:02:03","committed: fix(ui): show story name instead of epic/feature name on cards\n\nAPI (stories/route.ts): add name: parsed.name to FeatureStory response.\nBoard (notion-board.tsx): update all 6 name fallback chains to prefer\n  item.name first, before falling back to feature.name.\n\nBefore: 'Auth & App Shell' (epic name) on every card in the feature\nAfter: 'Build login screen with API token input' (story name)","ui/src/app/api/stories/route.ts,ui/src/components/notion-board.tsx"
  "2026-05-24 07:18:54","committed: feat(engine+ui): scaffold-as-epic with conditional bootstrap guard\n\nENGINE:\n- types.ts: BridgeConfig.project.bootstrapped?: boolean\n- config.ts: isBootstrapped() reads factory.yaml flag (absent/true = ok, false = blocked)\n            setBootstrapped() writes flag back atomically after AppStory succeeds\n- queue.ts: replaces brittle done/<app>.yaml file check with isBootstrapped() call\n            calls setBootstrapped(true) in runBuild() after AppStory build succeeds\n\nAPI:\n- /api/bootstrap-status: GET returns { bootstrapped, scaffoldStory, projectName }\n                          POST marks project as bootstrapped (for existing projects)\n\nUI (notion-board.tsx):\n- Fetches /api/bootstrap-status on load and on project switch\n- handleSingleBuild: gates FeatureStory builds behind bootstrap check\n  Shows blocking toast with 'Build Scaffold \\u2192' action button\n- Ready to Build column: amber banner when !bootstrapped with direct CTA\n- MobileKanbanBoard + KanbanColumn: wired bootstrap/scaffoldStoryFile props\n\nDOCS:\n- skills/spec-bootstrap/SKILL.md: teaches scaffold epic pattern + bootstrapped field\n- AGENTS.md: documents Scaffold Epic section and bootstrap guard","AGENTS.md,engine/config.ts,engine/queue.ts,engine/types.ts,skills/spec-bootstrap/SKILL.md,ui/src/app/api/bootstrap-status/route.ts,ui/src/components/notion-board.tsx"
  "2026-05-24 07:25:52","committed: feat(ui): auto-topological queue + Build Epic button\n\nTOPO SORT ENGINE (top of file):\n- topoSort(targets, allStories): DFS — for each story visits all dependsOn\n  prerequisites first, then emits the story. Cycle-safe via 'visiting' guard set.\n  Skips already-done stories. Deduplicates by file path.\n- resolveDependencyChain(story, allStories): wraps topoSort for single-story case.\n\nhandleSingleBuild (improved):\n- Resolves full dependency chain for the target story\n- If chain > 1 (unbuilt prereqs exist): queues the whole chain in topo order,\n  shows toast: 'Queued X + auto-added N prerequisites → name1, name2'\n- If chain == 1: falls through to original single-story path (no change)\n\nhandleBuildReadyStories (improved):\n- Replaces epicIndex+phase sort with topoSort() across all ready stories\n- Also pulls in any unbuilt prerequisites of ready stories automatically\n\nhandleBuildEpic (new):\n- Takes a feature epic object\n- Collects all non-done stories in that epic\n- Calls topoSort(epicStories, mergedStories) — also resolves cross-epic deps\n- Queues all in order, starts pipeline, navigates to Build tab\n- Shows 'Building \"Epic Name\" — N stories in order' toast\n\nPlan tree epic header (list view):\n- '▶ Build Epic' button on each epic row (hidden when all stories done)\n- stopPropagation so it doesn't collapse the accordion\n- Sits next to the progress bar on desktop",ui/src/components/notion-board.tsx
  "2026-05-24 07:29:06","committed: ui: replace 'Gated' badge with tree icon + dep count\n\nKanbanCard (board columns):\n- Was: Lock icon 'Gated' badge + Clock icon 'N pending' badge\n- Now: single inline SVG tree icon + number (scaffold + prereq deps summed)\n- Amber colour, tooltip names what's pending on hover\n\nListStoryRow (plan tree):\n- Was: 'Scaffold Baseline Missing' + 'Prerequisite Dependencies Pending (N)'\n- Now: SVG tree icon + 'N dep(s) pending' inline\n- Tooltip lists the actual story names that are blocking\n\nBoth: badge only appears when deps are unbuilt and story is not done",ui/src/components/notion-board.tsx
