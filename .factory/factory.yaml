version: 1
name: factory
description: Bridge for factory
factory_home: /Users/pretheesh/Projects/factory
stack:
  framework: node
  packageManager: npm
  linter: eslint
conventions:
  rules: .factory/knowledge
  agents: .factory/AGENTS.md
delivery:
  mode: pull-request
  executor: pi-sdk
  localModelsOnly: true
  requireHumanMerge: true
  maxWorkers: 1
  leaseMinutes: 10
  unattended:
    enabled: false
    maxRuntimeMinutes: 30
    maxToolCalls: 150
    maxChangedFiles: 25
    maxChangedLines: 2000
agentic:
  logs_dir: .factory/logs
  task_queue: .factory/task-manager/todo.yaml
  skill_index: .factory/skill-index.yaml
  workflows_dir: .factory/workflows
  knowledge_dir: .factory/knowledge
