  "2026-05-23 08:37:11","committed: docs+skills: update all references to new .factory structure\n\n- AGENTS.md: rewrite Bridge, Specs, Knowledge sections\n  scaffold.yaml replaces app.yaml as planning file\n  knowledge/ = ADRs/decisions (not build logs)\n  logs/ = all machine-written runtime output\n- skills/blueprint-manager: full rewrite for new structure\n- skills/story-generator: path renames (sed pass)\n- skills/spec-bootstrap, app-context: path renames (already correct)\n- pi-app: .factory restructured\n  - app.yaml → scaffold.yaml\n  - blueprint/ + context/ → logs/\n  - specs/ and stories/apps/ removed\n  - factory.yaml updated with logs_dir, stories_dir keys","AGENTS.md,skills/blueprint-manager/SKILL.md,skills/story-generator/SKILL.md"
